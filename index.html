<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080302" />
    <meta name="description" content="Meet SUNRISE REPUBLIC, a new nightclub in Nha Trang, Vietnam. Planned opening: 31 December. Explore the space and find your way here." />
    <title>SUNRISE REPUBLIC — Stay till sunrise.</title>
    <style>
      html { background: #080302; }
      html:has(#root[inert]) { overflow: hidden; scrollbar-gutter: stable; }
      #site-preloader:not([hidden]) {
        position: fixed;
        z-index: 300;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #fff4e7;
        background: radial-gradient(ellipse at center, #290b05, #080302 68%);
        font: 650 13px/1.45 'Montserrat Variable', Arial, sans-serif;
        text-align: center;
        touch-action: none;
      }
      .preloader-frame { width: clamp(172px, 58vmin, 288px); }
      .preloader-mark { position: relative; display: grid; place-items: center; aspect-ratio: 1; }
      .preloader-ring { position: absolute; inset: 0; width: 100%; height: 100%; }
      .preloader-emblem { width: 52%; height: auto; filter: brightness(0) invert(1); }
      .preloader-light { transform-box: view-box; transform-origin: center; animation: preloader-orbit 2.2s linear infinite; }
      .preloader-name { margin: 16px 0 0; letter-spacing: .2em; }
      .preloader-status { margin: 8px 0 0; color: #f4bca7; font-size: 11px; font-weight: 500; letter-spacing: .08em; }
      @keyframes preloader-orbit { to { transform: rotate(1turn); } }
      @media (prefers-reduced-motion: reduce) { .preloader-light { animation: none; } }
    </style>
  </head>
  <body>
    <div id="site-preloader" hidden>
      <div class="preloader-frame">
        <div class="preloader-mark" aria-hidden="true">
          <svg class="preloader-ring" viewBox="0 0 240 240" fill="none">
            <defs>
              <linearGradient id="preloader-ember" x1="30" y1="55" x2="163" y2="9" gradientUnits="userSpaceOnUse">
                <stop stop-color="#681207" stop-opacity="0"/>
                <stop offset=".67" stop-color="#df3819"/>
                <stop offset="1" stop-color="#ffd19a"/>
              </linearGradient>
            </defs>
            <circle cx="120" cy="120" r="108" stroke="#712816"/>
            <circle cx="120" cy="120" r="98" stroke="#512016"/>
            <g class="preloader-light">
              <path d="M30 60A108 108 0 0 1 164 21" stroke="url(#preloader-ember)" stroke-width="7" opacity=".35"/>
              <path d="M30 60A108 108 0 0 1 164 21" stroke="url(#preloader-ember)" stroke-width="2" stroke-linecap="round"/>
            </g>
          </svg>
          <svg class="preloader-emblem" viewBox="120 20 700 525">
            <image href="%BASE_URL%media/logo.png" width="989" height="853" />
          </svg>
        </div>
        <p class="preloader-name" translate="no">SUNRISE REPUBLIC</p>
        <p class="preloader-status" role="status">Loading…</p>
      </div>
    </div>
    <div id="root"></div>
    <div class="site-grain" aria-hidden="true"></div>
    <script>
      (() => {
        const hash = location.hash;
        if ((hash && hash !== '#home') || performance.getEntriesByType('navigation')[0]?.type === 'back_forward') return;

        const overlay = document.getElementById('site-preloader');
        const root = document.getElementById('root');
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
        const started = performance.now();
        overlay.hidden = false;
        root.inert = true;

        const deadline = window.setTimeout(finish, 5000);
        document.addEventListener('sunrise:portal-settled', finish, { once: true });

        function release() {
          overlay.hidden = true;
          root.inert = false;
        }

        function finish() {
          window.clearTimeout(deadline);
          document.removeEventListener('sunrise:portal-settled', finish);
          if (reducedMotion.matches) {
            release();
            return;
          }
          window.setTimeout(() => {
            overlay.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 340, easing: 'ease-out', fill: 'forwards' })
              .finished.then(release, release);
          }, Math.max(0, 950 - (performance.now() - started)));
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
